name: archespace_mobile
description: "Everything in One Encrypted Space"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # arc1 crypto port: Argon2id + AES-GCM (pure Dart).
  cryptography: ^2.7.0
  # Same backend as the web app (Auth, Postgres, RLS, Realtime).
  supabase_flutter: ^2.8.0
  # Biometric gate + OS keystore for the vault key.
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  # Markdown rendering for old Markdown notes (until they're edited, which
  # turns them into Rich text).
  flutter_markdown: ^0.7.4
  # The Rich text editor: the web's Tiptap editor, bundled offline into
  # assets/rich_text_editor.html, runs in a WebView.
  webview_flutter: ^4.14.1
  # Syntax highlighting for the Code item type (auto-detects the language).
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  # Local filesystem path for the offline (ciphertext) cache.
  path_provider: ^2.1.4
  # Persisted appearance preferences (theme mode + accent).
  shared_preferences: ^2.3.0
  # PDF export + native share/print sheet.
  pdf: ^3.11.0
  printing: ^5.13.0
  # Save / open the JSON backup file.
  file_picker: ^8.1.0
  # Open the build-commit link on GitHub from Settings.
  url_launcher: ^6.3.2
  # QR code for two-factor auth (TOTP) enrolment.
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates the app launcher icons from the ArcheSpace mark.
  flutter_launcher_icons: ^0.14.1

# App launcher icon: a dark background with the mint A mark.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0d1117"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    # Built from the web repo: `npm run build:mobile-editor`.
    - assets/rich_text_editor.html
    - assets/whiteboard_editor.html
    # The sample space a new account starts with (shared with the web app).
    - spec/welcome-space.json
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/fonts/DejaVuSansMono.ttf
